<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KGP Bazaar | IIT Kharagpur Campus Trade</title>
    <meta name="description" content="KGP Bazaar - Buy, sell, and request items on IIT Kharagpur campus." />
    <meta name="theme-color" content="#FAF4E8">

    <!-- Preload self-hosted variable font — must be before stylesheets so the browser
         fetches it during HTML parse rather than after CSS parse. Without this hint the
         font is discovered late and causes FOUT on the Sign In heading (the LCP element
         on that page). crossorigin is required for CORS preloading of font files. -->
    <link rel="preload" href="/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

    <!-- Preconnect to Supabase (API + storage share this origin). This is a
         client-rendered app: the browser has no idea this origin exists until JS
         executes and fetches listing data, so without this hint the DNS/TCP/TLS
         handshake to it only starts after JS parse — which, on the feed/profile/detail
         pages, is directly on the critical path to the LCP element (a listing photo
         served from this same origin; confirmed via LargestContentfulPaint entry.url
         during measurement, not assumed). Preconnect lets that handshake happen in
         parallel with JS download/parse instead of after it. -->
    <link rel="preconnect" href="https://mxvgzdmxdrevxcjiyvqt.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://mxvgzdmxdrevxcjiyvqt.supabase.co" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="alternate icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/masked-icon.svg" color="#8C2F39" />

    <!-- iOS standalone behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KGP Bazaar" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Link previews (WhatsApp is how this app spreads) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KGP Bazaar" />
    <meta property="og:title" content="KGP Bazaar | IIT Kharagpur Campus Trade" />
    <meta property="og:description" content="Buy, sell, and request second-hand items across IIT Kharagpur halls." />
    <meta property="og:url" content="https://kgpbazaar.vercel.app/" />
    <meta property="og:image" content="https://kgpbazaar.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />


    

  </head>
  <body class="bg-bg text-ink font-sans antialiased selection:bg-accent-wash selection:text-accent preload">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        document.body.classList.remove('preload');
      });
    </script>
  </body>
</html>

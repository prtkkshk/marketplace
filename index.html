<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KGP Bazaar | IIT Kharagpur Campus Trade</title>
    <meta name="description" content="KGP Bazaar - Buy, sell, and request items on IIT Kharagpur campus." />
    <meta name="theme-color" content="#FBF9F6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14110F" media="(prefers-color-scheme: dark)">

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="alternate icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/masked-icon.svg" color="#8C2F39" />

    <!-- iOS standalone behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KGP Bazaar" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Link previews (WhatsApp is how this app spreads) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KGP Bazaar" />
    <meta property="og:title" content="KGP Bazaar | IIT Kharagpur Campus Trade" />
    <meta property="og:description" content="Buy, sell, and request second-hand items across IIT Kharagpur halls." />
    <meta property="og:url" content="https://kgpbazaar.vercel.app/" />
    <meta property="og:image" content="https://kgpbazaar.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />


    
    <script>
      (function () {
        var s = localStorage.getItem('kgp-theme');
        var d = s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body class="bg-paper text-ink font-sans antialiased selection:bg-brand-wash selection:text-brand preload">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        document.body.classList.remove('preload');
      });
    </script>
  </body>
</html>

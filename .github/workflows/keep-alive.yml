name: Keep-Alive

on:
  schedule:
    # Run every 2 days at 00:00 UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase URL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            curl -sSf "${SUPABASE_URL}/rest/v1/" > /dev/null || true
          else
            echo "SUPABASE_URL secret is not set, skipping keep-alive ping."
          fi
